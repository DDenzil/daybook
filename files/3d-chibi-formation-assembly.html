            keyLight.shadow.camera.left = -shadowBounds;
            keyLight.shadow.camera.right = shadowBounds;
            keyLight.shadow.camera.top = shadowBounds;
            keyLight.shadow.camera.bottom = -shadowBounds;
            keyLight.shadow.bias = -0.0005;
            keyLight.shadow.normalBias = 0.02;
            scene.add(keyLight);

            // Cool Rim / Back Light to accentuate smooth clay silhouettes
            const rimLight = new THREE.DirectionalLight(0xe0f2fe, 0.45);
            rimLight.position.set(-16, 16, -18);
            scene.add(rimLight);

            // Soft Front Fill Light
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.25);
            fillLight.position.set(-12, 8, 16);
            scene.add(fillLight);

            // Seamless Minimalist Studio Floor
            const floorGeo = new THREE.PlaneGeometry(220, 220);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0xf4f6f9,
                roughness: 0.85,
                metalness: 0.02
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Subtle outer studio boundary ring
            const outerRingGeo = new THREE.RingGeometry(24.5, 24.68, 96);
            const outerRingMat = new THREE.MeshBasicMaterial({
                color: 0xdbe2ea,
                side: THREE.DoubleSide
            });
            const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
            outerRing.rotation.x = -Math.PI / 2;
            outerRing.position.y = 0.004;
            scene.add(outerRing);

            // Initialize shared PBR clay/vinyl materials for both groups
            steadyMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(CONFIG.steadyHex),
                roughness: 0.72,
                metalness: 0.04
            });
            stumblerMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(CONFIG.stumblerHex),
                roughness: 0.72,
                metalness: 0.04
            });
        }

        /**
         * Creates subtle circular target pads on the floor for each formation spot
         * so viewers can watch the dynamic grid fill up.
         */
        function rebuildFormationMarkers(slotCoords) {
            // Clear any existing markers
            gridMarkers.forEach(m => {
                scene.remove(m.group);
                m.ringMat.dispose();
                m.dotMat.dispose();
            });
            gridMarkers = [];

            const ringGeo = new THREE.RingGeometry(0.36, 0.44, 32);
            const dotGeo = new THREE.CircleGeometry(0.12, 20);

            slotCoords.forEach(coord => {
                const markerGroup = new THREE.Group();
                markerGroup.position.set(coord.x, 0.005, coord.z);

                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xcbd5e1,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.75
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                markerGroup.add(ring);

                const dotMat = new THREE.MeshBasicMaterial({
                    color: 0xcbd5e1,
                    transparent: true,
                    opacity: 0.45
                });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.rotation.x = -Math.PI / 2;
                dot.position.y = 0.001;
                markerGroup.add(dot);

                scene.add(markerGroup);
                gridMarkers.push({ group: markerGroup, ringMat, dotMat, occupied: false });
            });
        }

        /**
         * Computes centered world coordinates for all `count` formation slots,
         * centering any partial back row cleanly.
         */
        function computeCenteredSlotPositions(count, cols, rows) {
            const coords = [];
            let placed = 0;
            for (let r = 0; r < rows; r++) {
                const remaining = count - placed;
                const itemsInThisRow = Math.min(cols, remaining);
                for (let c = 0; c < itemsInThisRow; c++) {
                    const x = (c - (itemsInThisRow - 1) / 2) * CONFIG.spacingX;
                    const z = (r - (rows - 1) / 2) * CONFIG.spacingZ;
                    coords.push(new THREE.Vector3(x, 0, z));
                    placed++;
                }
            }
            return coords;
        }

        // ==========================================
        // 4. DETERMINISTIC CHOREOGRAPHY & TIMELINES
        // ==========================================
        // Seeded pseudo-random helper so timeline scrubbing is 100% deterministic & repeatable
        function seededRandom(seed) {
            const x = Math.sin(seed * 91.3458) * 47453.5453;
            return x - Math.floor(x);
        }

        /**
         * Generates all personnel based on CONFIG.totalCharacters and CONFIG.stumblerRatio,
         * assigns centered grid slots, randomizes starting positions across the entire studio floor
         * with collision separation, and builds deterministic fall schedules for the stumbling group.
         */
        function buildSimulation() {
            // Remove previous character meshes if regenerating
            characters.forEach(c => scene.remove(c.rig.root));
            characters = [];

            // Remove active dust particles
            dustParticles.forEach(p => {
                scene.remove(p.mesh);
                p.mat.dispose();
            });
            dustParticles = [];

            // Compute grid layout and counts
            const count = CONFIG.totalCharacters;
            const grid = computeFormationGrid(count);
            CONFIG.cols = grid.cols;
            CONFIG.rows = grid.rows;

            const redCount = count <= 1 ? 0 : Math.min(count - 1, Math.round(count * CONFIG.stumblerRatio));
            const greenCount = count - redCount;
            CONFIG.redCount = redCount;
            CONFIG.greenCount = greenCount;

            // Update grid shape label in panel
            const gridLabel = document.getElementById('grid-shape-label');
            if (gridLabel) {
                gridLabel.textContent = `Formation Grid: ${CONFIG.cols} × ${CONFIG.rows} (${count} total)`;
            }

            // Compute centered target coordinates & rebuild floor markers
            const slotCoords = computeCenteredSlotPositions(count, CONFIG.cols, CONFIG.rows);
            rebuildFormationMarkers(slotCoords);

            // Evenly distribute stumbling personnel across the formation slots
            const redSlotIndices = new Set();
            if (redCount > 0) {
                for (let k = 0; k < redCount; k++) {
                    const slotIdx = Math.floor(((k + 0.5) * count) / redCount);
                    redSlotIndices.add(slotIdx);
                }
            }

            // Generate non-overlapping random starting positions across the studio floor
            const spawnRadiusLimit = Math.max(21.0, Math.sqrt(count) * 3.1);
            const minSpawnDist = 1.45;
            const assignedSpawns = [];

            for (let idx = 0; idx < count; idx++) {
                let candidate = new THREE.Vector3();
                let attempts = 0;
                while (attempts < 120) {
                    const randSeed = CONFIG.spawnSeed * 997 + idx * 53 + attempts * 13;
                    // Uniform random scatter across a wide circular studio floor (radius 2.0 to spawnRadiusLimit)
                    const angle = seededRandom(randSeed + 1) * Math.PI * 2;
                    const rNorm = Math.sqrt(seededRandom(randSeed + 2));
                    const radius = 2.2 + rNorm * (spawnRadiusLimit - 2.2);
                    candidate.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

                    let tooClose = false;
                    for (let j = 0; j < assignedSpawns.length; j++) {
                        if (candidate.distanceToSquared(assignedSpawns[j]) < minSpawnDist * minSpawnDist) {
                            tooClose = true;
                            break;
                        }
                    }
                    if (!tooClose) break;
                    attempts++;
                }
                assignedSpawns.push(candidate);
            }

            let redCounter = 0;
            let greenCounter = 0;

            // Randomly pick 0-3 stumblers who crawl the last stretch, and 0-3 others who sit at their spot.
            // Seeded from the spawn seed, so scrubbing is repeatable and Shuffle re-rolls them.
            const redOrderShuffled = Array.from({ length: redCount }, (_, i) => i)
                .sort((a, b) => seededRandom(CONFIG.spawnSeed * 3 + a * 31) - seededRandom(CONFIG.spawnSeed * 3 + b * 31));
            const crawlCount = Math.min(redCount, Math.floor(seededRandom(CONFIG.spawnSeed * 7 + 3) * 4));
            const sitCount = Math.min(redCount - crawlCount, Math.floor(seededRandom(CONFIG.spawnSeed * 7 + 9) * 4));
            const crawlerOrders = new Set(redOrderShuffled.slice(0, crawlCount));
            const sitterOrders = new Set(redOrderShuffled.slice(crawlCount, crawlCount + sitCount));
            CONFIG.crawlCount = crawlCount;
            CONFIG.sitCount = sitCount;

            slotCoords.forEach((targetPos, idx) => {
                const isRed = redSlotIndices.has(idx);
                const charSeed = CONFIG.spawnSeed * 31 + idx * 17 + 5;
                const startPos = assignedSpawns[idx];
                const initialYaw = (seededRandom(charSeed + 9) - 0.5) * Math.PI * 2;

                // Create 3D articulated mesh using shared group material
                const meshRig = createChibiCharacter(isRed ? stumblerMaterial : steadyMaterial);
                meshRig.root.position.copy(startPos);
                meshRig.root.rotation.y = initialYaw;
                scene.add(meshRig.root);

                // Build movement & fall schedule (scaled cleanly to 38-42s full duration)
                let startTime, walkDuration, falls = [];
                let isCrawler = false, isSitter = false, crawlStart = Infinity, walkPre = 0;
                const distance = startPos.distanceTo(targetPos);

                if (!isRed) {
                    // Steady characters start staggered between 0.0s and 4.5s, arriving smoothly between 12s and 25s
                    startTime = seededRandom(charSeed + 3) * 4.5;
                    const baseSpeed = 1.15 + seededRandom(charSeed + 4) * 0.45;
                    // Ensure even very close random spawns take at least 7.5s with a relaxed pace so movement feels organic
                    walkDuration = Math.max(7.5, Math.min(21.0, distance / baseSpeed));
                    greenCounter++;
                } else {
                    // Stumbling characters take 32s - 40.5s total due to multiple falls
                    startTime = 0.4 + (redCounter / Math.max(1, redCount)) * 2.4;
                    const numFalls = 2 + (redCounter % 3); // 2, 3, or 4 falls per stumbler
                    const totalArrivalTarget = 32.5 + seededRandom(charSeed + 5) * 7.8; // Arrive near end (32.5s - 40.3s)

                    const activeSpan = totalArrivalTarget - startTime - 2.8;
                    const segment = activeSpan / (numFalls + 1);

                    for (let f = 0; f < numFalls; f++) {
                        const fallStart = startTime + segment * (f + 0.75) + (seededRandom(charSeed + f * 11) - 0.5) * 1.1;
                        const fallDuration = 2.45; // 0.45s fall + 1.1s dazed on ground + 0.9s push up
                        const fallDir = seededRandom(charSeed + f * 13) > 0.35 ? 1 : -1;
                        falls.push({
                            start: fallStart,
                            duration: fallDuration,
                            direction: fallDir,
                            dustSpawned: false
                        });
                    }

                    const totalFallPauseTime = falls.reduce((acc, f) => acc + f.duration, 0);
                    walkDuration = Math.max(6.0, (totalArrivalTarget - startTime) - totalFallPauseTime);

                    isCrawler = crawlerOrders.has(redCounter);
                    isSitter = sitterOrders.has(redCounter);
                    if (isCrawler) {
                        // Last fall comes a little earlier, lands face-down, and they never get back up:
                        // they rise onto hands and knees and crawl the rest of the way.
                        const last = falls[falls.length - 1];
                        const prev = falls[falls.length - 2];
                        last.start = Math.max(prev ? prev.start + prev.duration + 0.6 : startTime + 1.5, last.start - segment * 0.25);
                        last.direction = 1;
                        last.toCrawl = true;
                        crawlStart = last.start + last.duration;
                        walkPre = Math.max(0.5, (last.start - startTime) - falls.slice(0, -1).reduce((a, f) => a + f.duration, 0));
                        const remainingUnits = Math.max(1.5, (totalArrivalTarget - crawlStart) / CRAWL_SLOWDOWN);
                        walkDuration = walkPre + remainingUnits;
                    }
                    redCounter++;
                }

                // Slight curved path lateral arc so characters weave naturally past one another
                const curveArc = (seededRandom(charSeed + 15) - 0.5) * Math.min(4.2, distance * 0.38);

                characters.push({
                    id: idx,
                    isRed,
                    isCrawler,
                    isSitter,
                    crawlStart,
                    walkPre,
                    redOrder: isRed ? redCounter - 1 : -1,
                    slotIndex: idx,
                    rig: meshRig,
                    startPos,
                    targetPos,
                    initialYaw,
                    curveArc,
                    startTime,
                    walkDuration,
                    falls,
                    walkPhaseOffset: seededRandom(charSeed + 7) * Math.PI * 2,
                    wobbleFreq: 2.8 + seededRandom(charSeed + 8) * 1.5,
                    arrived: false,
                    currentPos: startPos.clone(),
                    currentYaw: initialYaw
                });
            });

            // Reset followed stumbler reference if in follow mode
            const redChars = characters.filter(c => c.isRed);
            if (redChars.length > 0) {
                state.followedRedIndex = state.followedRedIndex % redChars.length;
                state.followedChar = redChars[state.followedRedIndex];
            } else {
                state.followedChar = null;
            }
        }

        // ==========================================
        // 5. DUST PUFF PARTICLE SYSTEM (ON FALLS)
        // ==========================================
        const dustGeo = new THREE.SphereGeometry(0.16, 10, 8);

        function spawnDustPuff(worldPos) {
            for (let i = 0; i < 8; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: 0xe2e8f0,
                    transparent: true,
                    opacity: 0.75
                });
                const mesh = new THREE.Mesh(dustGeo, mat);
                const angle = (i / 8) * Math.PI * 2 + Math.random() * 0.4;
                const speed = 0.8 + Math.random() * 1.2;
                mesh.position.set(
                    worldPos.x + Math.cos(angle) * 0.2,
                    0.12 + Math.random() * 0.15,
                    worldPos.z + Math.sin(angle) * 0.2
                );
                scene.add(mesh);
                dustParticles.push({
                    mesh,
                    mat,
                    vx: Math.cos(angle) * speed,
                    vy: 0.6 + Math.random() * 0.8,
                    vz: Math.sin(angle) * speed,
                    age: 0,
                    maxAge: 0.65 + Math.random() * 0.25
                });
            }
        }

        function updateDustParticles(dt) {
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.age += dt;
                if (p.age >= p.maxAge) {
                    scene.remove(p.mesh);
                    p.mat.dispose();
                    dustParticles.splice(i, 1);
                    continue;
                }
                const progress = p.age / p.maxAge;
                p.mesh.position.x += p.vx * dt;
                p.mesh.position.y += p.vy * dt;
                p.mesh.position.z += p.vz * dt;
                p.vy *= 0.92;
                const scale = 1.0 + progress * 1.4;
                p.mesh.scale.set(scale, scale, scale);
                p.mat.opacity = 0.75 * (1 - progress);
            }
        }

        // ==========================================
        // 6. ARTICULATED POSE & MOTION EVALUATOR
        // ==========================================
        function smoothstep(edge0, edge1, x) {
            const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
            return t * t * (3 - 2 * t);
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        /**
         * Evaluates exact position, orientation, and limb joint angles for a character at time `t`.
         * Being purely deterministic allows seamless timeline scrubbing forward and backward!
         */
        function evaluateCharacterAtTime(char, t, isPlayingForward) {
            const rig = char.rig;

            // Reset base pivots cleanly each frame
            rig.fallPivot.rotation.set(0, 0, 0);
            rig.fallPivot.position.set(0, 0, 0);
            rig.pelvis.position.set(0, 0.82, 0);
            rig.pelvis.rotation.set(0, 0, 0);
            rig.torsoGroup.rotation.set(0, 0, 0);
            rig.headGroup.rotation.set(0, 0, 0);
            // Reset every limb too, so scrubbing between crawl / sit / walk never leaves a joint bent
            [rig.leftArm, rig.rightArm].forEach(a => { a.shoulder.rotation.set(0, 0, 0); a.elbow.rotation.set(0, 0, 0); a.hand.rotation.set(0, 0, 0); });
            [rig.leftLeg, rig.rightLeg].forEach(l => { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(0, 0, 0); l.foot.rotation.set(0, 0, 0); });

            // 1. Check if character hasn't started walking yet
            if (t <= char.startTime) {
                char.arrived = false;
                char.currentPos.copy(char.startPos);
                rig.root.position.copy(char.startPos);

                char.currentYaw = char.initialYaw;
                rig.root.rotation.y = char.initialYaw;

                // Subtle idle breathing
                const breath = Math.sin(t * 2.5 + char.walkPhaseOffset) * 0.02;
                applyIdleArmsDownPose(rig, breath);
                applyNeutralLegsPose(rig);
                return;
            }

            // 2. Compute effective walking time (subtracting any completed or active fall durations)
            let effectiveWalkTime = 0;
            let activeFall = null;
            let fallLocalTime = 0;
            let cursor = char.startTime;

            for (let i = 0; i < char.falls.length; i++) {
                const f = char.falls[i];
                if (t < f.start) {
                    effectiveWalkTime += Math.max(0, t - cursor);
                    cursor = t;
                    break;
                } else if (t >= f.start && t <= f.start + f.duration) {
                    effectiveWalkTime += Math.max(0, f.start - cursor);
                    activeFall = f;
                    fallLocalTime = t - f.start;
                    cursor = t;
                    break;
                } else {
                    effectiveWalkTime += Math.max(0, f.start - cursor);
                    cursor = f.start + f.duration;
                }
            }
            if (!activeFall && t > cursor) {
                effectiveWalkTime += (t - cursor);
            }

            // Crawlers move slower once they are down on hands and knees
            const crawling = char.isCrawler && !activeFall && t >= char.crawlStart;
            if (crawling) {
                effectiveWalkTime = char.walkPre + (t - char.crawlStart) / CRAWL_SLOWDOWN;
            }

            // Progress along path [0..1]
            const rawProgress = Math.min(1.0, effectiveWalkTime / char.walkDuration);
            // Smooth ease-in-out at very start and arrival
            const pathProgress = rawProgress < 1.0
                ? smoothstep(0, 0.04, rawProgress) * 0.04 + Math.max(0, rawProgress - 0.04)
                : 1.0;

            // Compute current world XZ position along a gentle curved arc
            const pos = new THREE.Vector3().lerpVectors(char.startPos, char.targetPos, pathProgress);

            const toTarget = new THREE.Vector3().subVectors(char.targetPos, char.startPos);
            const pathLen = Math.max(0.001, toTarget.length());
            const dir = toTarget.clone().divideScalar(pathLen);
            const perp = new THREE.Vector3(-dir.z, 0, dir.x);

            // Smooth parabolic curve offset so crossing paths look natural
            const arcOffset = Math.sin(pathProgress * Math.PI) * char.curveArc;
            pos.addScaledVector(perp, arcOffset);

            // Add erratic side-to-side wobble for Red characters while walking
            if (char.isRed && rawProgress < 1.0 && !crawling) {
                const wobbleEnv = Math.sin(rawProgress * Math.PI); // Taper wobble at start and end
                const lateralWobble = Math.sin(effectiveWalkTime * char.wobbleFreq + char.walkPhaseOffset) * 0.65 * wobbleEnv;
                pos.addScaledVector(perp, lateralWobble);
            }

            char.currentPos.copy(pos);
            rig.root.position.copy(pos);

            // Compute instantaneous tangent heading along the curved path
            const dArc = Math.cos(pathProgress * Math.PI) * Math.PI * char.curveArc;
            const tangent = dir.clone().multiplyScalar(pathLen).addScaledVector(perp, dArc).normalize();
            const travelYaw = Math.atan2(tangent.x, tangent.z);

            // 3. Handle Active Fall & Recovery Animation (Stumbling Group)
            if (activeFall) {
                char.arrived = false;
                const d = activeFall.direction; // +1 = faceplant forward, -1 = backward tumble
                const fT = fallLocalTime / activeFall.duration; // 0..1

                // Face direction of travel during fall
                rig.root.rotation.y = travelYaw;

                // Spawn dust puff right as body hits the ground (around fT = 0.22)
                if (isPlayingForward && fT >= 0.20 && fT <= 0.28 && !activeFall.dustSpawned) {
                    activeFall.dustSpawned = true;
                    spawnDustPuff(pos);
                } else if (fT < 0.15) {
                    activeFall.dustSpawned = false;
                }

                let fallPitch = 0;
                let groundSink = 0;
                let pushUpExtension = 0;

                if (activeFall.toCrawl && fT >= 0.62) {
                    // Phase D (crawlers): instead of standing up, get onto hands and knees
                    applyCrawlPose(rig, char.walkPhaseOffset, smoothstep(0.62, 1.0, fT), LYING_POSE);
                    return;
                }

                if (fT < 0.22) {
                    // Phase A: Trip & Fall rapidly onto ground (with slight bounce)
                    const p = fT / 0.22;
                    const easeIn = p * p;
                    fallPitch = d * easeIn * (Math.PI / 2 - 0.08);
                    groundSink = easeIn * 0.26;
                } else if (fT < 0.30) {
                    // Phase B: Impact bounce on ground
                    const b = (fT - 0.22) / 0.08;
                    const bounce = Math.sin(b * Math.PI) * 0.12;
                    fallPitch = d * ((Math.PI / 2 - 0.08) - bounce);
                    groundSink = 0.26 - bounce * 0.15;
                } else if (fT < 0.62) {
                    // Phase C: Lying flat on ground, slightly dazed / wiggling legs
                    fallPitch = d * (Math.PI / 2 - 0.08);
                    groundSink = 0.26;
                    const wiggle = Math.sin((fT - 0.30) * 28) * 0.08;
                    rig.leftLeg.knee.rotation.x = Math.max(0, wiggle * 3);
                    rig.rightLeg.knee.rotation.x = Math.max(0, -wiggle * 3);
                } else {
                    // Phase D: Push back up to standing
                    const r = smoothstep(0.62, 1.0, fT);
                    fallPitch = d * (1 - r) * (Math.PI / 2 - 0.08);
                    groundSink = (1 - r) * 0.26;
                    pushUpExtension = Math.sin(r * Math.PI);
                }

                rig.fallPivot.rotation.x = fallPitch;
                rig.fallPivot.position.y = groundSink;

                // Arms flail during fall, then push against floor during recovery
                rig.leftArm.shoulder.rotation.set(-0.6 - pushUpExtension * 0.7, 0, -0.45);
                rig.rightArm.shoulder.rotation.set(-0.6 - pushUpExtension * 0.7, 0, 0.45);
                rig.leftArm.elbow.rotation.set(-0.4 + pushUpExtension * 0.3, 0, 0);
                rig.rightArm.elbow.rotation.set(-0.4 + pushUpExtension * 0.3, 0, 0);

                // Head looks up slightly while pushing back up
                rig.headGroup.rotation.x = -d * pushUpExtension * 0.45;
                return;
            }

            // 4a. Crawling State (crawlers after their last fall)
            if (crawling && rawProgress < 1.0) {
                char.arrived = false;
                char.currentYaw = travelYaw;
                rig.root.rotation.y = travelYaw;
                const crawlCycle = (t - char.crawlStart) * 5.0 + char.walkPhaseOffset;
                applyCrawlPose(rig, crawlCycle, 1, LYING_POSE);
                return;
            }

            // 4. Walking State (In transit to grid spot)
            if (rawProgress < 1.0) {
                char.arrived = false;

                // Smoothly turn from initial random orientation onto the curved travel heading
                const turnBlend = smoothstep(0, 0.12, pathProgress);
                let deltaAngle = travelYaw - char.initialYaw;
                while (deltaAngle > Math.PI) deltaAngle -= Math.PI * 2;
                while (deltaAngle < -Math.PI) deltaAngle += Math.PI * 2;
                let moveAngle = char.initialYaw + deltaAngle * turnBlend;

                if (char.isRed) {
                    const wobbleSlope = Math.cos(effectiveWalkTime * char.wobbleFreq + char.walkPhaseOffset) * 0.35;
                    moveAngle += wobbleSlope;
                }
                char.currentYaw = moveAngle;
                rig.root.rotation.y = moveAngle;

                // Cute bouncy bipedal walk cycle
                const strideSpeed = char.isRed ? 8.2 : 9.6;
                const cycle = effectiveWalkTime * strideSpeed + char.walkPhaseOffset;
                const legSwing = Math.sin(cycle) * (char.isRed ? 0.62 : 0.55);
                const oppLegSwing = Math.sin(cycle + Math.PI) * (char.isRed ? 0.62 : 0.55);

                // Vertical body bounce (double frequency of stride)
                const bounce = Math.abs(Math.sin(cycle)) * 0.075;
                rig.pelvis.position.y = 0.82 + bounce;

                // Slight playful torso sway & forward lean
                rig.torsoGroup.rotation.x = char.isRed ? 0.12 : 0.06;
                rig.torsoGroup.rotation.z = Math.sin(cycle) * (char.isRed ? 0.11 : 0.05);
                rig.headGroup.rotation.z = -Math.sin(cycle) * 0.04;

                // Legs articulation
                rig.leftLeg.hip.rotation.x = legSwing;
                rig.rightLeg.hip.rotation.x = oppLegSwing;
                rig.leftLeg.knee.rotation.x = Math.max(0, -legSwing * 0.85);
                rig.rightLeg.knee.rotation.x = Math.max(0, -oppLegSwing * 0.85);

                // Opposite arm swing
                rig.leftArm.shoulder.rotation.set(oppLegSwing * 0.75, 0, -0.18);
                rig.rightArm.shoulder.rotation.set(legSwing * 0.75, 0, 0.18);
                rig.leftArm.elbow.rotation.set(-0.35 - Math.max(0, -oppLegSwing * 0.4), 0, 0);
                rig.rightArm.elbow.rotation.set(-0.35 - Math.max(0, -legSwing * 0.4), 0, 0);
                return;
            }

            // 5. Arrived at Grid Spot: Turn forward (+Z) & Strike Iconic 'Hands-On-Hips' Pose!
            char.arrived = true;
            let timeSinceArrival = effectiveWalkTime - char.walkDuration;

            if (char.isCrawler) {
                // Arrived on all fours: push up to standing first, then strike the pose
                const realSince = timeSinceArrival * CRAWL_SLOWDOWN;
                const rise = smoothstep(0, 1.4, realSince);
                if (rise < 1) {
                    char.currentYaw = travelYaw;
                    rig.root.rotation.y = travelYaw;
                    applyCrawlPose(rig, 0, 1 - rise, STANDING_POSE);
                    return;
                }
                timeSinceArrival = realSince - 1.4;
            }
            const settleBlend = smoothstep(0, 0.85, timeSinceArrival); // 0.85s smooth transition

            // Shortest angular interpolation from arrival tangent heading to facing camera (yaw = 0)
            let startYaw = travelYaw;
            while (startYaw > Math.PI) startYaw -= Math.PI * 2;
            while (startYaw < -Math.PI) startYaw += Math.PI * 2;
            const currentYaw = lerp(startYaw, 0, settleBlend);
            char.currentYaw = currentYaw;
            rig.root.rotation.y = currentYaw;

            if (char.isSitter) {
                // Sitters turn to the front and sit down on their spot, hands resting on their knees
                applyIdleArmsDownPose(rig, 0);
                applyNeutralLegsPose(rig);
                applySitPose(rig, smoothstep(0.35, 1.9, timeSinceArrival), t, char.walkPhaseOffset);
                return;
            }

            // Gentle proud breathing idle once in formation
            const idleBreath = Math.sin(t * 2.6 + char.walkPhaseOffset) * 0.018 * settleBlend;
            rig.pelvis.position.y = 0.82 + idleBreath * 0.4;
            rig.torsoGroup.rotation.x = -0.04 * settleBlend; // Slight confident chest-out tilt
            rig.headGroup.rotation.x = 0.03 * settleBlend;

            // Legs plant neatly shoulder-width apart
            applyNeutralLegsPose(rig);

            // Iconic Hands-On-Hips Pose (matching the attached reference image)
            // Upper arms flare outward (~42 deg), elbows bend inward (~82 deg) so hands rest cleanly on waist!
            const poseT = settleBlend;

            // Left Arm (-X side)
            rig.leftArm.shoulder.rotation.set(
                lerp(0, 0.12, poseT),
                lerp(0, -0.25, poseT),
                lerp(-0.18, -0.74, poseT)
            );
            rig.leftArm.elbow.rotation.set(
                lerp(-0.3, -0.18, poseT),
                0,
                lerp(0, 1.48, poseT)
            );
            rig.leftArm.hand.rotation.set(0, 0, lerp(0, 0.35, poseT));

            // Right Arm (+X side)
            rig.rightArm.shoulder.rotation.set(
                lerp(0, 0.12, poseT),
                lerp(0, 0.25, poseT),
                lerp(0.18, 0.74, poseT)
            );
            rig.rightArm.elbow.rotation.set(
                lerp(-0.3, -0.18, poseT),
                0,
                lerp(0, -1.48, poseT)
            );
            rig.rightArm.hand.rotation.set(0, 0, lerp(0, -0.35, poseT));
        }

        // Crawl / sit poses. Angles are relative to the body: with the body pitched forward by P,
        // a limb rotated by -P hangs straight down, and a knee bent 90 degrees lays the shin flat.
        const CRAWL_SLOWDOWN = 1.6;           // crawling covers ground 1.6x slower than walking
        const CRAWL_PITCH = 1.02;             // ~58 degrees forward: hands and knees both reach the floor
        const CRAWL_LIFT = 0.05;
        const LYING_POSE = { pitch: Math.PI / 2 - 0.08, lift: 0.26, shoulderX: -0.6, shoulderZ: 0.45, elbowX: -0.4, hipX: 0, hipZ: 0, kneeX: 0, headX: 0 };
        const STANDING_POSE = { pitch: 0, lift: 0, shoulderX: 0, shoulderZ: 0.18, elbowX: -0.2, hipX: 0, hipZ: 0.04, kneeX: 0, headX: 0 };

        /**
         * Hands-and-knees crawl. w = 1 is the full crawl pose; w = 0 is the `base` pose
         * (lying flat after a fall, or standing upright), so the same function handles
         * getting down onto all fours and getting back up.
         */
        function applyCrawlPose(rig, cycle, w, base) {
            const P = CRAWL_PITCH;
            const s = Math.sin(cycle);
            rig.fallPivot.rotation.x = lerp(base.pitch, P, w);
            rig.fallPivot.position.y = lerp(base.lift, CRAWL_LIFT, w);
            rig.pelvis.position.y = 0.82 + Math.abs(Math.cos(cycle)) * 0.025 * w;
            rig.torsoGroup.rotation.set(0, 0, Math.sin(cycle) * 0.07 * w);
            rig.headGroup.rotation.set(lerp(base.headX, -0.8, w), 0, 0);

            // Opposite arm and knee move together
            rig.leftArm.shoulder.rotation.set(lerp(base.shoulderX, -P - s * 0.32, w), 0, lerp(-base.shoulderZ, -0.08, w));
            rig.rightArm.shoulder.rotation.set(lerp(base.shoulderX, -P + s * 0.32, w), 0, lerp(base.shoulderZ, 0.08, w));
            rig.leftArm.elbow.rotation.set(lerp(base.elbowX, -0.1 - Math.max(0, -s) * 0.3, w), 0, 0);
            rig.rightArm.elbow.rotation.set(lerp(base.elbowX, -0.1 - Math.max(0, s) * 0.3, w), 0, 0);
            rig.leftArm.hand.rotation.set(0, 0, 0);
            rig.rightArm.hand.rotation.set(0, 0, 0);

            rig.leftLeg.hip.rotation.set(lerp(base.hipX, -P + s * 0.26, w), 0, lerp(-base.hipZ, -0.07, w));
            rig.rightLeg.hip.rotation.set(lerp(base.hipX, -P - s * 0.26, w), 0, lerp(base.hipZ, 0.07, w));
            rig.leftLeg.knee.rotation.set(lerp(base.kneeX, Math.PI / 2 + 0.08 + Math.max(0, s) * 0.22, w), 0, 0);
            rig.rightLeg.knee.rotation.set(lerp(base.kneeX, Math.PI / 2 + 0.08 + Math.max(0, -s) * 0.22, w), 0, 0);
            rig.leftLeg.foot.rotation.set(0, 0, 0);
            rig.rightLeg.foot.rotation.set(0, 0, 0);
        }

        /** Sitting on the floor, knees up, hands resting on the knees. w = 0 standing, 1 seated. */
        function applySitPose(rig, w, t, phase) {
            const breath = Math.sin(t * 2.4 + phase) * 0.012 * w;
            rig.pelvis.position.y = lerp(0.82, 0.27, w);
            rig.torsoGroup.rotation.set(lerp(0, -0.12, w) + breath, 0, 0);
            rig.headGroup.rotation.set(lerp(0, 0.1, w), 0, 0);

            rig.leftLeg.hip.rotation.set(lerp(0, -1.9, w), 0, lerp(-0.04, -0.16, w));
            rig.rightLeg.hip.rotation.set(lerp(0, -1.9, w), 0, lerp(0.04, 0.16, w));
            rig.leftLeg.knee.rotation.set(lerp(0, 1.2, w), 0, 0);
            rig.rightLeg.knee.rotation.set(lerp(0, 1.2, w), 0, 0);
            rig.leftLeg.foot.rotation.set(lerp(0, 0.7, w), 0, 0);
            rig.rightLeg.foot.rotation.set(lerp(0, 0.7, w), 0, 0);

            rig.leftArm.shoulder.rotation.set(lerp(0, -0.75, w), 0, lerp(-0.18, -0.14, w));
            rig.rightArm.shoulder.rotation.set(lerp(0, -0.75, w), 0, lerp(0.18, 0.14, w));
            rig.leftArm.elbow.rotation.set(lerp(-0.2, -0.04, w), 0, 0);
            rig.rightArm.elbow.rotation.set(lerp(-0.2, -0.04, w), 0, 0);
            rig.leftArm.hand.rotation.set(0, 0, 0);
            rig.rightArm.hand.rotation.set(0, 0, 0);
        }

        function applyIdleArmsDownPose(rig, breath) {
            rig.leftArm.shoulder.rotation.set(0, 0, -0.18 - breath);
            rig.rightArm.shoulder.rotation.set(0, 0, 0.18 + breath);
            rig.leftArm.elbow.rotation.set(-0.2, 0, 0);
            rig.rightArm.elbow.rotation.set(-0.2, 0, 0);
            rig.leftArm.hand.rotation.set(0, 0, 0);
            rig.rightArm.hand.rotation.set(0, 0, 0);
        }

        function applyNeutralLegsPose(rig) {
            rig.leftLeg.hip.rotation.set(0, 0, -0.04);
            rig.rightLeg.hip.rotation.set(0, 0, 0.04);
            rig.leftLeg.knee.rotation.set(0, 0, 0);
            rig.rightLeg.knee.rotation.set(0, 0, 0);
            rig.leftLeg.foot.rotation.set(0, 0, 0);
            rig.rightLeg.foot.rotation.set(0, 0, 0);
        }

        // ==========================================
        // 7. CAMERA PRESETS & SMOOTH TRACKING
        // ==========================================
        const cameraPresets = {
            overview: {
                pos: new THREE.Vector3(0, 15.0, 26.0),
                target: new THREE.Vector3(0, 1.2, 0)
            },
            front: {
                pos: new THREE.Vector3(0, 4.8, 17.5),
                target: new THREE.Vector3(0, 1.4, -0.5)
            }
        };

        let cameraTransition = null;

        function setCameraPreset(mode) {
            state.cameraMode = mode;

            // Update active button styling
            document.querySelectorAll('.cam-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            if (mode === 'overview') {
                const btn = document.getElementById('cam-overview');
                btn.classList.add('active');
                cameraTransition = {
                    destPos: cameraPresets.overview.pos.clone(),
                    destTarget: cameraPresets.overview.target.clone(),
                    alpha: 0
                };
            } else if (mode === 'front') {
                const btn = document.getElementById('cam-front');
                btn.classList.add('active');
                cameraTransition = {
                    destPos: cameraPresets.front.pos.clone(),
                    destTarget: cameraPresets.front.target.clone(),
                    alpha: 0
                };
            } else if (mode === 'followRed') {
                const btn = document.getElementById('cam-follow-red');
                btn.classList.add('active');
                cameraTransition = null;

                // Pick a Red character that hasn't arrived yet (or cycle through them)
                const redChars = characters.filter(c => c.isRed);
                const activeReds = redChars.filter(c => !c.arrived);
                if (activeReds.length > 0) {
                    state.followedRedIndex = (state.followedRedIndex + 1) % activeReds.length;
                    state.followedChar = activeReds[state.followedRedIndex];
                } else {
                    state.followedRedIndex = (state.followedRedIndex + 1) % redChars.length;
                    state.followedChar = redChars[state.followedRedIndex];
                }
            }
        }

        function updateCamera(dt) {
            if (state.cameraMode === 'followRed' && state.followedChar) {
                const c = state.followedChar;
                const desiredTarget = new THREE.Vector3(c.currentPos.x, 1.35, c.currentPos.z);
                const desiredCamPos = new THREE.Vector3(
                    c.currentPos.x + 3.2,
                    3.6,
                    c.currentPos.z + 5.4
                );
                controls.target.lerp(desiredTarget, Math.min(1, dt * 5.5));
                camera.position.lerp(desiredCamPos, Math.min(1, dt * 3.5));
            } else if (cameraTransition) {
                cameraTransition.alpha += dt * 2.5;
                const t = Math.min(1, cameraTransition.alpha);
                camera.position.lerp(cameraTransition.destPos, 0.1);
                controls.target.lerp(cameraTransition.destTarget, 0.1);
                if (camera.position.distanceTo(cameraTransition.destPos) < 0.08) {
                    cameraTransition = null;
                }
            }
            controls.update();
        }

        // ==========================================
        // 8. HUD & UI CONTROLS WIRING
        // ==========================================
        function formatTime(sec) {
            const clamped = Math.max(0, Math.floor(sec));
            const mins = Math.floor(clamped / 60);
            const secs = clamped % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateHUD() {
            const greenArrived = characters.filter(c => !c.isRed && c.arrived).length;
            const redArrived = characters.filter(c => c.isRed && c.arrived).length;

            document.getElementById('green-counter').textContent = `${greenArrived} / ${CONFIG.greenCount}`;
            document.getElementById('red-counter').textContent = `${redArrived} / ${CONFIG.redCount}`;

            document.getElementById('time-elapsed').textContent = formatTime(state.elapsed);
            document.getElementById('timeline-scrubber').value = state.elapsed.toFixed(2);
            const pct = (state.elapsed / CONFIG.totalDuration) * 100;
            document.getElementById('timeline-fill').style.width = `${pct}%`;

            // Update floor grid marker colors when occupied using active group shades
            const steadyColorObj = new THREE.Color(CONFIG.steadyHex);
            const stumblerColorObj = new THREE.Color(CONFIG.stumblerHex);

            for (let i = 0; i < characters.length; i++) {
                const c = characters[i];
                const marker = gridMarkers[c.slotIndex];
                if (!marker) continue;
                if (c.arrived) {
                    marker.occupied = true;
                    const activeCol = c.isRed ? stumblerColorObj : steadyColorObj;
                    marker.ringMat.color.copy(activeCol);
                    marker.ringMat.opacity = 0.85;
                    marker.dotMat.color.copy(activeCol);
                } else if (!c.arrived && marker.occupied) {
                    marker.occupied = false;
                    marker.ringMat.color.setHex(0xcbd5e1);
                    marker.ringMat.opacity = 0.75;
                    marker.dotMat.color.setHex(0xcbd5e1);
                }
            }

            // Contextual status message
            const statusEl = document.getElementById('status-banner');
            if (greenArrived + redArrived === CONFIG.totalCharacters) {
                statusEl.textContent = `Formation complete! All ${CONFIG.totalCharacters} personnel in ${CONFIG.cols}×${CONFIG.rows} grid.`;
                statusEl.classList.add('complete');
            } else if (greenArrived === CONFIG.greenCount && CONFIG.redCount > 0) {
                statusEl.textContent = 'Steady squad assembled! Stumbling personnel recovering...';
                statusEl.classList.remove('complete');
            } else {
                statusEl.textContent = `Assembling ${CONFIG.totalCharacters} personnel into ${CONFIG.cols}×${CONFIG.rows} grid...`;
                statusEl.classList.remove('complete');
            }
        }

        /**
         * Updates the 3D materials and HUD swatches live whenever the user picks a new shade.
         */
        function applyShadeSelection(group, hex) {
            if (group === 'steady') {
                CONFIG.steadyHex = hex;
                steadyMaterial.color.set(hex);
                document.getElementById('picker-steady').value = hex;
                document.getElementById('hex-steady').textContent = hex;
                document.getElementById('steady-dot').style.backgroundColor = hex;
            } else {
                CONFIG.stumblerHex = hex;
                stumblerMaterial.color.set(hex);
                document.getElementById('picker-stumbler').value = hex;
                document.getElementById('hex-stumbler').textContent = hex;
                document.getElementById('stumbler-dot').style.backgroundColor = hex;
                document.getElementById('cam-stumbler-dot').style.backgroundColor = hex;
            }
            updateHUD();
        }

        function renderShadeSwatches() {
            const steadyContainer = document.getElementById('swatches-steady');
            STEADY_SWATCHES.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.title = s.name;
                btn.className = 'swatch';
                btn.style.backgroundColor = s.hex;
                btn.addEventListener('click', () => applyShadeSelection('steady', s.hex));
                steadyContainer.appendChild(btn);
            });

            const stumblerContainer = document.getElementById('swatches-stumbler');
            STUMBLER_SWATCHES.forEach(s => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.title = s.name;
                btn.className = 'swatch';
                btn.style.backgroundColor = s.hex;
                btn.addEventListener('click', () => applyShadeSelection('stumbler', s.hex));
                stumblerContainer.appendChild(btn);
            });
        }

        function initUI() {
            renderShadeSwatches();

            const btnPlayPause = document.getElementById('btn-play-pause');
            const iconPause = document.getElementById('icon-pause');
            const iconPlay = document.getElementById('icon-play');
            const labelPlayPause = document.getElementById('label-play-pause');

            function syncPlayButtonUI() {
                if (state.isPlaying) {
                    iconPause.classList.remove('hidden');
                    iconPlay.classList.add('hidden');
                    labelPlayPause.textContent = 'Pause';
                } else {
                    iconPause.classList.add('hidden');
                    iconPlay.classList.remove('hidden');
                    labelPlayPause.textContent = 'Play';
                }
            }

            btnPlayPause.addEventListener('click', () => {
                if (state.elapsed >= CONFIG.totalDuration) {
                    state.elapsed = 0;
                }
                state.isPlaying = !state.isPlaying;
                if (state.isPlaying) hideHudNow();
                syncPlayButtonUI();
            });

            document.getElementById('btn-restart').addEventListener('click', () => {
                state.elapsed = 0;
                state.isPlaying = true;
                characters.forEach(c => c.falls.forEach(f => f.dustSpawned = false));
                hideHudNow();
                syncPlayButtonUI();
            });

            // Settings Panel Toggle
            const settingsPanel = document.getElementById('studio-settings-panel');
            document.getElementById('btn-toggle-settings').addEventListener('click', () => {
                settingsPanel.classList.toggle('hidden');
            });
            document.getElementById('btn-close-settings').addEventListener('click', () => {
                settingsPanel.classList.add('hidden');
            });

            // Live Shade Color Pickers
            document.getElementById('picker-steady').addEventListener('input', (e) => {
                applyShadeSelection('steady', e.target.value);
            });
            document.getElementById('picker-stumbler').addEventListener('input', (e) => {
                applyShadeSelection('stumbler', e.target.value);
            });

            // Personnel Count & Stumbling Ratio Controls
            const countSlider = document.getElementById('input-total-count');
            const countNumber = document.getElementById('input-total-number');
            const ratioSlider = document.getElementById('input-stumbler-ratio');
            const ratioLabel = document.getElementById('label-stumbler-share');

            function syncConfigPreviewLabels() {
                const count = Math.max(6, Math.min(120, parseInt(countSlider.value, 10) || 50));
                const pct = parseInt(ratioSlider.value, 10);
                const estStumblers = count <= 1 ? 0 : Math.min(count - 1, Math.round(count * (pct / 100)));
                const grid = computeFormationGrid(count);
                ratioLabel.textContent = `${pct}% (${estStumblers})`;
                document.getElementById('grid-shape-label').textContent = `Formation Grid: ${grid.cols} × ${grid.rows} (${count} total)`;
            }

            countSlider.addEventListener('input', () => {
                countNumber.value = countSlider.value;
                syncConfigPreviewLabels();
            });
            countNumber.addEventListener('input', () => {
                const val = Math.max(6, Math.min(120, parseInt(countNumber.value, 10) || 6));
                countSlider.value = val;
                syncConfigPreviewLabels();
            });
            ratioSlider.addEventListener('input', syncConfigPreviewLabels);

            function regenerateWithCurrentSettings(randomizeSeed) {
                const newCount = Math.max(6, Math.min(120, parseInt(countSlider.value, 10) || 50));
                countSlider.value = newCount;
                countNumber.value = newCount;
                CONFIG.totalCharacters = newCount;
                CONFIG.stumblerRatio = parseInt(ratioSlider.value, 10) / 100;
                if (randomizeSeed) {
                    CONFIG.spawnSeed = Math.floor(Math.random() * 100000) + 1;
                }
                buildSimulation();
                state.elapsed = 0;
                state.isPlaying = true;
                hideHudNow();
                syncPlayButtonUI();
                characters.forEach(c => evaluateCharacterAtTime(c, 0, false));
                updateHUD();
            }

            document.getElementById('btn-apply-regenerate').addEventListener('click', () => {
                regenerateWithCurrentSettings(true);
            });

            document.getElementById('btn-quick-shuffle').addEventListener('click', () => {
                regenerateWithCurrentSettings(true);
            });

            // Timeline scrubber
            const scrubber = document.getElementById('timeline-scrubber');
            scrubber.max = CONFIG.totalDuration;
            scrubber.addEventListener('input', (e) => {
                state.elapsed = parseFloat(e.target.value);
                characters.forEach(c => evaluateCharacterAtTime(c, state.elapsed, false));
                updateHUD();
            });

            // Speed toggles
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.speed = parseFloat(btn.dataset.speed);
                    document.querySelectorAll('.speed-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                });
            });

            // Camera Presets
            document.getElementById('cam-overview').addEventListener('click', () => setCameraPreset('overview'));
            document.getElementById('cam-front').addEventListener('click', () => setCameraPreset('front'));
            document.getElementById('cam-follow-red').addEventListener('click', () => setCameraPreset('followRed'));

            // Cancel auto-transition if user manually grabs OrbitControls
            controls.addEventListener('start', () => {
                cameraTransition = null;
                if (state.cameraMode === 'followRed') {
                    // Allow free orbiting once user drags manually
                    state.cameraMode = 'free';
                    document.querySelectorAll('.cam-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                }
            });

            // Responsive Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // ==========================================
        // 9. MAIN ANIMATION LOOP
        // ==========================================
        // ==========================================
        // 8b. AUTO-HIDING HUD
        // ==========================================
        // Controls are hidden while playing. Tap the scene to bring them back for a few
        // seconds; they stay up while you use them and whenever playback is paused or finished.
        const HUD_REVEAL_MS = 5000;
        let hudRevealUntil = 0;
        let hudVisible = true;

        function revealHud(ms = HUD_REVEAL_MS) { hudRevealUntil = performance.now() + ms; }
        function hideHudNow() { hudRevealUntil = 0; }

        function updateHudVisibility(now) {
            const shouldShow = !state.isPlaying || now < hudRevealUntil;
            if (shouldShow !== hudVisible) {
                hudVisible = shouldShow;
                document.body.classList.toggle('hud-hidden', !shouldShow);
            }
        }

        function initHudAutoHide() {
            // Any interaction with the controls keeps them on screen a little longer
            ['header', 'footer', '#studio-settings-panel'].forEach(sel => {
                const el = document.querySelector(sel);
                ['pointerdown', 'input', 'change', 'focusin'].forEach(evt =>
                    el.addEventListener(evt, () => revealHud(), true));
            });

            // A quick tap on the 3D scene (not an orbit drag) toggles the controls
            const canvas = renderer.domElement;
            let down = null;
            canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
            canvas.addEventListener('pointerup', e => {
                if (!down) return;
                const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
                const quick = performance.now() - down.t < 350;
                down = null;
                if (moved < 8 && quick && state.isPlaying) {
                    if (hudVisible) hideHudNow(); else revealHud();
                }
            });
        }

        // ==========================================
        // 8c. FULL SCREEN + BACK
        // ==========================================
        // Where the browser allows it (computers, Android, iPad) playback goes full screen.
        // iPhone Safari only allows that for videos, so on iPhone open this page from the
        // Daybook app or a Home Screen icon, which already hides the browser bars.
        const fsRoot = document.documentElement;
        const fsSupported = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
        const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

        function enterFullscreen() {
            if (!fsSupported || isFullscreen()) return;
            const req = fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen;
            try {
                const p = req.call(fsRoot, { navigationUI: 'hide' });
                if (p && p.catch) p.catch(() => {});
            } catch (e) { /* ignore: browser refused */ }
        }
        function exitFullscreen() {
            const ex = document.exitFullscreen || document.webkitExitFullscreen;
            if (isFullscreen() && ex) ex.call(document);
        }

        function initFullscreenAndBack() {
            const fsBtn = document.getElementById('btn-fullscreen');
            if (fsSupported) {
                fsBtn.classList.remove('hidden');
                fsBtn.addEventListener('click', () => (isFullscreen() ? exitFullscreen() : enterFullscreen()));
                // The first touch or click while playing takes the page full screen
                document.addEventListener('pointerup', () => { if (state.isPlaying) enterFullscreen(); }, { capture: true, once: true });
                ['btn-play-pause', 'btn-restart', 'btn-quick-shuffle', 'btn-apply-regenerate'].forEach(id =>
                    document.getElementById(id).addEventListener('click', () => { if (state.isPlaying) enterFullscreen(); }));
            }

            const back = document.getElementById('btn-back');
            if (history.length > 1 || document.referrer) {
                back.classList.remove('hidden');
                back.addEventListener('click', () => {
                    exitFullscreen();
                    if (history.length > 1) history.back();
                    else location.href = document.referrer || '../';
                });
            }
        }

        function animate(now) {
            requestAnimationFrame(animate);

            if (!lastFrameTime) lastFrameTime = now;
            const rawDt = Math.min(0.1, (now - lastFrameTime) / 1000);
            lastFrameTime = now;

            if (state.isPlaying) {
                state.elapsed += rawDt * state.speed;
                if (state.elapsed >= CONFIG.totalDuration) {
                    state.elapsed = CONFIG.totalDuration;
                    state.isPlaying = false;
                    document.getElementById('icon-pause').classList.add('hidden');
                    document.getElementById('icon-play').classList.remove('hidden');
                    document.getElementById('label-play-pause').textContent = 'Replay';
                }
            }

            // Evaluate all 50 characters at current timestamp
            for (let i = 0; i < characters.length; i++) {
                evaluateCharacterAtTime(characters[i], state.elapsed, state.isPlaying);
            }

            updateDustParticles(rawDt * state.speed);
            updateCamera(rawDt);
            updateHUD();

            updateHudVisibility(now);
            renderer.render(scene, camera);
        }

        // Start application cleanly on window load
        window.onload = function () {
            initScene();
            initSharedGeometries();
            buildSimulation();
            initUI();
            initHudAutoHide();
            initFullscreenAndBack();
            document.body.classList.add('hud-hidden'); // playing from the start, so start clean
            hudVisible = false;
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
