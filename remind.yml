# Daybook reminders — installed into the PRIVATE data repo by the app.
# Runs every 30 minutes from 05:07 to 23:37 Doha time (cron is in UTC; Doha = UTC+3).
# Change the hours on the cron line if you move time zones.
name: Daybook reminders

on:
  schedule:
    - cron: "7,37 2-20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, or test to send a test notification"
        required: false
        default: "auto"

permissions:
  contents: write

concurrency:
  group: daybook-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web push library
        run: pip install --quiet "pywebpush>=2,<3"

      - name: Send due reminders
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python scripts/remind.py

      - name: Save sent log
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "daybook-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data
            git commit -q -m "Daybook: reminder log"
            git pull -q --rebase
            git push -q
          fi
